name = "gilga-unshorten"
main = "src/index.ts"
compatibility_date = "2026-01-15"
compatibility_flags = ["nodejs_compat"]

# プロダクションでは gilga.llll-ll.com/api/unshorten にルーティングする想定。
# 実デプロイ時に下の routes を有効化してから `wrangler deploy` する。
#
# [[routes]]
# pattern = "gilga.llll-ll.com/api/unshorten"
# zone_name = "llll-ll.com"

# 観察用ログ（フルURLは残さない設計、index.ts 側でホストのみ console.log）
[observability]
enabled = true

# レート制限: IP ベースで 30 req / 60 sec。
# namespace_id は実デプロイ時に CF が割り当てる識別子。local dev では undefined になり、index.ts 側でスキップする。
[[unsafe.bindings]]
name = "RATE_LIMITER"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 30, period = 60 }
